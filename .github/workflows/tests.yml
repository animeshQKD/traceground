name: tests

on:
  push:
  pull_request:
  workflow_call:        # publish.yml runs these tests before it builds

permissions:
  contents: read

jobs:
  pytest:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.11"
          - os: windows-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package (not editable, so the tests use what pip installs)
        run: python -m pip install ".[test]"
      - name: Tests (offline; no keys, no network, no models)
        run: python -m pytest
