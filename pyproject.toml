[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "traceground"
version = "0.2.0"
description = "Checks an AI answer against its sources or its tool-call trace: every number, quote, value and argument the evidence doesn't support. No model needed."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Animesh Sinha Roy" }]
requires-python = ">=3.10"
dependencies = []          # the core uses the standard library only
keywords = ["llm", "agents", "rag", "hallucination", "grounding", "evaluation", "guardrails", "tool-calling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
traceground = "traceground.cli:main"

[project.urls]
Homepage = "https://github.com/animeshQKD/traceground"
Issues = "https://github.com/animeshQKD/traceground/issues"
Changelog = "https://github.com/animeshQKD/traceground/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.sdist]
# the survey and the tests stay in the repository; the sdist carries only what builds and tests the package
include = ["/src/traceground", "/tests", "/README.md", "/LICENSE", "/CHANGELOG.md", "/pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/traceground"]

[tool.pytest.ini_options]
testpaths = ["tests", "survey", "eval", "space"]
addopts = "-q"
